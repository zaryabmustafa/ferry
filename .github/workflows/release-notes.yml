# Rewrite the notes of every published release from the commit history (run by hand, for example
# after changing changelog.sh). New releases get their notes from build.yml.
name: Release notes

on:
  workflow_dispatch:

jobs:
  notes:
    name: Notes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Write the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for tag in $(git tag -l 'v*' --sort=version:refname); do
            TAG=$tag bash .github/scripts/release.sh
          done
