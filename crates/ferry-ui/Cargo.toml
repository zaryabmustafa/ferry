[package]
name = "ferry-ui"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ferry-core = { path = "../ferry-core" }
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software", "unstable-winit-030", "accessibility"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
